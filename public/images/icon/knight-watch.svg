<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006837"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Shield Icon -->
  <g transform="translate(6, 6)">
    <!-- Outer Shield -->
    <path d="M24,2 C36,2 45,7 46,14 C46,30 35,42 24,46 C13,42 2,30 2,14 C3,7 12,2 24,2 Z" fill="url(#shieldGrad)" stroke="#ce1126" stroke-width="2"/>
    <!-- Inner Watch Eye -->
    <path d="M12,24 C16,17 32,17 36,24 C32,31 16,31 12,24 Z" fill="#020617" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="5" fill="url(#goldAccent)"/>
    <circle cx="24" cy="24" r="2" fill="#FFFFFF"/>
    <!-- Guarding Star / Cross -->
    <path d="M24,6 L25.5,10 L29.5,11.5 L25.5,13 L24,17 L22.5,13 L18.5,11.5 L22.5,10 Z" fill="#FACC15"/>
  </g>

  <!-- Typography -->
  <text x="64" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="-0.5" fill="currentColor">
    KNIGHT<tspan fill="#006837" dx="4">WATCH</tspan>
  </text>
  <text x="65" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="8.5" letter-spacing="2" fill="#64748B" text-transform="uppercase">
    KENYA CAMPAIGN FINANCE WATCH
  </text>
</svg>
