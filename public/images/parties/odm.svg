<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="#FFFFFF" stroke="#EA580C" stroke-width="8"/>
  <!-- Orange Fruit -->
  <circle cx="100" cy="115" r="50" fill="url(#orangeGrad)" stroke="#C2410C" stroke-width="3"/>
  <!-- Orange Leaf -->
  <path d="M100,68 C115,50 145,55 135,78 C120,85 105,78 100,68 Z" fill="#15803D" stroke="#166534" stroke-width="2"/>
  <path d="M100,68 Q118,65 125,74" stroke="#86EFAC" stroke-width="2" fill="none"/>
  <!-- Fruit stem -->
