  <!-- Text -->
  <text x="100" y="42" font-family="system-ui, sans-serif" font-weight="900" font-size="26" fill="#EA580C" text-anchor="middle" letter-spacing="3">ODM</text>
  <text x="100" y="182" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#1E3A8A" text-anchor="middle" letter-spacing="1">CHUNGWA MOJA</text>
