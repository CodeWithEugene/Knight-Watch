<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="udaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#udaGrad)" stroke="#15803D" stroke-width="8"/>
  <!-- Wheelbarrow wheel -->
  <circle cx="58" cy="135" r="22" fill="#1E293B" stroke="#FACC15" stroke-width="4"/>
  <circle cx="58" cy="135" r="8" fill="#FACC15"/>
  <!-- Wheelbarrow tray -->
  <polygon points="58,125 150,90 142,125 78,135" fill="#15803D" stroke="#0F172A" stroke-width="3"/>
  <!-- Legs and stand -->
  <line x1="125" y1="125" x2="135" y2="155" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
  <!-- Handles -->
  <line x1="58" y1="135" x2="165" y2="82" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
  <line x1="150" y1="90" x2="170" y2="82" stroke="#15803D" stroke-width="7" stroke-linecap="round"/>
  <!-- Text ring -->
  <text x="100" y="44" font-family="system-ui, sans-serif" font-weight="900" font-size="24" fill="#15803D" text-anchor="middle" letter-spacing="3">UDA</text>
  <text x="100" y="180" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#1E293B" text-anchor="middle" letter-spacing="1.5">KAZI NI KAZI</text>
</svg>
